  </style>

  <script>

    /*
    ==========================================
    SONG DATA

    나중에 여기를 관리자 / Supabase와 연결할 예정.
    ==========================================
    */

    const songs = [

      {
        title: "Crush On You",
        artist: "크러쉬",

      },

      },

      {

        artist: "크러쉬",
        category: "K-POP"
        difficulty: 4 속련도
      },

      {
        title: "Beautiful",
        artist: "크러쉬",
        category: "K-POP",
        difficulty: 4 속련도
      },

      {
        title: "잊어버리지마",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "Rush Hour",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "미워",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "Monday Blues",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "어떻게지내",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "나빠",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "Whatever You Do",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      },

      {
        title: "티격태격",
        artist: "크러쉬",
        category: "R&B",
        difficulty: 4 속련도
      }

    ];


    let selectedCategory = "전체";
    let currentSong = null;
    let alphabetical = false;


    const songGrid =
      document.getElementById("songGrid");

    const searchInput =
      document.getElementById("searchInput");

    const resultCount =
      document.getElementById("resultCount");

    const emptyState =
      document.getElementById("emptyState");

    const modal =
      document.getElementById("songModal");

    const toast =
      document.getElementById("toast");


    /*
    ==========================================
    RENDER SONGS
    ==========================================
    */

    function renderSongs() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      let filtered =
        songs.filter(song => {

          const matchesCategory =
            selectedCategory === "전체" ||
            song.category === selectedCategory;


          const searchable =
            (
              song.title +
              " " +
              song.artist +
              " " +
              song.category
            ).toLowerCase();


          const matchesSearch =
            searchable.includes(search);


          return (
            matchesCategory &&
            matchesSearch
          );

        });


      if (alphabetical) {

        filtered.sort((a, b) =>
          a.title.localeCompare(
            b.title,
            "ko"
          )
        );

      }


      resultCount.textContent =
        `총 ${filtered.length}곡`;


      songGrid.innerHTML = "";


      if (filtered.length === 0) {

        songGrid.style.display = "none";
        emptyState.style.display = "block";

        return;

      }


      songGrid.style.display = "grid";
      emptyState.style.display = "none";


      /*
      Divide songs into 3 columns.
      */

      const columns = [
        [],
        [],
        []
      ];


      filtered.forEach((song, index) => {

        columns[index % 3].push(song);

      });


      columns.forEach(
        (columnSongs, columnIndex) => {

          const column =
            document.createElement("div");

          column.className =
            "column";


          const heading =
            document.createElement("div");

          heading.className =
            "column-title";


          heading.textContent =
            ["A", "B", "C"][columnIndex];


          column.appendChild(
            heading
          );


          columnSongs.forEach(song => {

            const button =
              document.createElement("button");

            button.className =
              "song";


            const info =
              document.createElement("div");

            info.className =
              "song-info";


            const title =
              document.createElement("div");

            title.className =
              "song-title";

            title.textContent =
              song.title;


            const artist =
              document.createElement("div");

            artist.className =
              "song-artist";

            artist.textContent =
              song.artist;


            info.appendChild(title);
            info.appendChild(artist);


            const meta =
              document.createElement("div");

            meta.className =
              "song-meta";

            meta.textContent =
              "클릭";


            button.appendChild(info);
            button.appendChild(meta);


            /*
            Click song → details.
            */

            button.addEventListener(
              "click",
              () => openSong(song)
            );


            column.appendChild(
              button
            );

          });


          songGrid.appendChild(
            column
          );

        }
      );

    }


    /*
    ==========================================
    OPEN SONG
    ==========================================
    */

    function openSong(song) {

      currentSong = song;


      document.getElementById(
        "modalCategory"
      ).textContent =
        song.category.toUpperCase();


      document.getElementById(
        "modalTitle"
      ).textContent =
        song.title;


      document.getElementById(
        "modalArtist"
      ).textContent =
        song.artist;


      document.getElementById(
        "modalDifficulty"
      ).textContent =
        "★".repeat(
          song.difficulty
        ) +
        "☆".repeat(
          5 - song.difficulty
        );


      document.getElementById(
        "modalGenre"
      ).textContent =
        song.category;


      modal.classList.add(
        "show"
      );

    }


    /*
    ==========================================
    COPY SONG
    ==========================================
    */

    document
      .getElementById("copyButton")
      .addEventListener(
        "click",
        async () => {

          if (!currentSong)
            return;


          const text =
            `${currentSong.title} · ${currentSong.artist}`;


          try {

            await navigator.clipboard.writeText(
              text
            );


            showToast(
              "✓ 복사되었습니다"
            );

          } catch {

            showToast(
              "복사에 실패했습니다"
            );

          }

        }
      );


    /*
    ==========================================
    CLOSE MODAL
    ==========================================
    */

    document
      .getElementById("closeModal")
      .addEventListener(
        "click",
        () => {

          modal.classList.remove(
            "show"
          );

        }
      );


    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          modal.classList.remove(
            "show"
          );

        }

      }
    );


    /*
    ==========================================
    SEARCH
    ==========================================
    */

    searchInput.addEventListener(
      "input",
      renderSongs
    );


    /*
    ==========================================
    FILTER
    ==========================================
    */

    document
      .querySelectorAll(".filter")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter")
              .forEach(
                b =>
                  b.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            selectedCategory =
              button.dataset.category;


            renderSongs();

          }
        );

      });


    /*
    ==========================================
    RANDOM SONG
    ==========================================
    */

    document
      .getElementById("randomButton")
      .addEventListener(
        "click",
        () => {

          const randomSong =
            songs[
              Math.floor(
                Math.random() *
                songs.length
              )
            ];


          openSong(
            randomSong
          );

        }
      );


    /*
    ==========================================
    SORT
    ==========================================
    */

    document
      .getElementById("sortButton")
      .addEventListener(
        "click",
        event => {

          alphabetical =
            !alphabetical;


          event.target.textContent =
            alphabetical
              ? "원래순"
              : "가나다순";


          renderSongs();

        }
      );


    /*
    ==========================================
    THEME
    ==========================================
    */

    document
      .getElementById("themeButton")
      .addEventListener(
        "click",
        () => {

          document.body.classList.toggle(
            "light"
          );


          const light =
            document.body.classList.contains(
              "light"
            );


          document.getElementById(
            "themeButton"
          ).textContent =
            light
              ? "☀"
              : "☾";

        }
      );


    /*
    ==========================================
    INITIAL LOAD
    ==========================================
    */

    renderSongs();

  </script>

</body>
