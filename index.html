<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>뜨사 노래책</title>

  <style>

    :root {
      --navy: #091540;
      --blue: #ABD2FA;
      --blue-soft: rgba(171, 210, 250, 0.10);
      --blue-hover: rgba(171, 210, 250, 0.18);
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);
      --border: rgba(171, 210, 250, 0.20);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;

      background: var(--navy);
      color: var(--white);

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    main {
      flex: 1;
    }


    button,
    input {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      backdrop-filter: blur(18px);

      background:
        rgba(9, 21, 64, 0.88);

      border-bottom:
        1px solid var(--border);
    }


    .header-inner {
      max-width: 1250px;

      min-height: 74px;

      margin: auto;

      padding:
        0 24px;

      display: flex;

      align-items: center;
      justify-content: space-between;
    }


    .logo {
      color: var(--blue);

      font-size: 21px;

      font-weight: 800;

      letter-spacing: 2px;
    }


    .logo span {
      display: block;

      margin-top: 2px;

      color: var(--white);

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 3px;

      opacity: 0.55;
    }


    .theme-button {
      width: 38px;
      height: 38px;

      border:
        1px solid var(--border);

      border-radius: 50%;

      background:
        var(--blue-soft);

      color: var(--white);
    }


    .theme-button:hover {
      background:
        var(--blue-hover);
    }



    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1250px;

      margin: auto;

      padding:
        80px 24px 55px;
    }


    .eyebrow {
      margin-bottom: 15px;

      color: var(--blue);

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 3px;
    }


    .hero h1 {
      font-size:
        clamp(45px, 7vw, 82px);

      line-height: 0.95;

      letter-spacing: -4px;
    }


    .hero h1 span {
      color: var(--blue);
    }


    .hero-description {
      max-width: 620px;

      margin-top: 20px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }



    /* =========================
       SEARCH
    ========================= */

    .controls {
      max-width: 1250px;

      margin: auto;

      padding:
        0 24px 30px;
    }


    .search-row {
      display: grid;

      grid-template-columns:
        1fr auto auto;

      gap: 10px;
    }


    .search-box {
      position: relative;
    }


    .search-icon {
      position: absolute;

      left: 16px;
      top: 50%;

      transform:
        translateY(-50%);

      color: var(--muted);

      font-size: 20px;
    }


    .search-box input {
      width: 100%;

      height: 52px;

      padding:
        0 18px 0 45px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      outline: none;

      background:
        var(--blue-soft);

      color: var(--white);
    }


    .search-box input::placeholder {
      color:
        rgba(255, 255, 255, 0.40);
    }


    .search-box input:focus {
      border-color:
        var(--blue);
    }


    .control-button {
      min-height: 52px;

      padding:
        0 17px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background:
        var(--blue-soft);

      color: var(--white);
    }


    .control-button:hover {
      background:
        var(--blue-hover);
    }

    .sort-select {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;

  font-size: 13px;
  font-weight: 500;

  color: var(--white);
  background: var(--blue-soft);

  border: 1px solid var(--border);
  border-radius: 12px;

  cursor: pointer;
}

.sort-select option {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;

  font-size: 13px;
}


    /* =========================
       GENRE FILTERS
    ========================= */

    .filters {
      display: flex;

      gap: 8px;

      margin-top: 15px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .filters::-webkit-scrollbar {
      display: none;
    }


    .filter {
      flex: 0 0 auto;

      padding:
        9px 15px;

      border:
        1px solid var(--border);

      border-radius: 999px;

      background: transparent;

      color: var(--muted);
    }


    .filter:hover,
    .filter.active {
      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        var(--navy);
    }



    /* =========================
       SONGBOOK
    ========================= */

    .songbook {
      max-width: 1250px;

      margin: auto;

      padding:
        0 24px 90px;
    }


    .songbook-top {
      margin-bottom: 15px;
    }


    .result-count {
      color: var(--muted);

      font-size: 13px;
    }


    .song-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  border:
    1px solid var(--border);

  border-radius: 16px;

  overflow: hidden;

  box-shadow: var(--shadow);

  align-items: start;
}


    .column {
      min-width: 0;

      border-right:
        1px solid var(--border);
    }


    .column:last-child {
      border-right: none;
    }


    .column-title {
      padding:
        16px 18px;

      border-bottom:
        1px solid var(--border);

      background:
        var(--blue-soft);

      color:
        var(--blue);

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    .song {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      padding:
        16px 18px;

      border: none;

      border-bottom:
        1px solid
        rgba(171, 210, 250, 0.09);

      background: transparent;

      color: var(--white);

      text-align: left;

      transition: 0.15s ease;
    }


    .song:hover {
      padding-left: 23px;

      background:
        var(--blue-soft);
    }


    .song-info {
      min-width: 0;
    }


    .song-title {
      overflow: hidden;

      color: var(--white);

      font-size: 14px;

      font-weight: 650;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    .song-artist {
      margin-top: 5px;

      overflow: hidden;

      color: var(--muted);

      font-size: 12px;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    .song-meta {
      flex: 0 0 auto;

      color: var(--blue);

      font-size: 11px;
    }



    /* =========================
       EMPTY
    ========================= */

    .empty {
      display: none;

      padding:
        70px 20px;

      color: var(--muted);

      text-align: center;
    }



    /* =========================
       SONG MODAL
    ========================= */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.65);

      backdrop-filter: blur(8px);
    }


    .modal.show {
      display: flex;
    }


    .modal-card {
      width:
        min(520px, 100%);

      padding: 28px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background:
        var(--navy);

      box-shadow:
        var(--shadow);
    }


    .modal-close {
      float: right;

      width: 34px;
      height: 34px;

      border:
        1px solid var(--border);

      border-radius: 50%;

      background: transparent;

      color: var(--white);

      font-size: 20px;
    }


    .modal-category {
      margin-bottom: 12px;

      color: var(--blue);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 2px;
    }


    .modal-title {
      margin-bottom: 5px;

      font-size: 30px;

      letter-spacing: -1px;
    }


    .modal-artist {
      margin-bottom: 25px;

      color: var(--muted);
    }


    .details {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }


    .detail {
      padding: 15px;

      border:
        1px solid
        rgba(171, 210, 250, 0.10);

      border-radius: 12px;

      background:
        var(--blue-soft);
    }


    .detail-label {
      margin-bottom: 6px;

      color: var(--muted);

      font-size: 10px;
    }


    .detail-value {
      color: var(--blue);

      font-weight: 700;
    }


    .copy-button {
      width: 100%;

      margin-top: 20px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background:
        var(--blue);

      color:
        var(--navy);

      font-weight: 800;
    }


    .copy-button:hover {
      opacity: 0.9;
    }



    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 28px;

      z-index: 200;

      padding:
        11px 18px;

      border-radius: 999px;

      background:
        var(--blue);

      color:
        var(--navy);

      font-size: 13px;

      font-weight: 700;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, 30px);

      transition: 0.25s ease;
    }


    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }



    /* =========================
       FOOTER
    ========================= */

    footer {
      padding:
        28px 20px;

      border-top:
        1px solid var(--border);

      color:
        var(--muted);

      font-size: 11px;

      text-align: center;

      background:
        rgba(0, 0, 0, 0.10);
    }



    /* =========================
       LIGHT MODE
    ========================= */

    body.light {
      --navy: #ffffff;

      --white: #091540;

      --muted:
        rgba(9, 21, 64, 0.60);

      --blue-soft:
        rgba(9, 21, 64, 0.05);

      --blue-hover:
        rgba(9, 21, 64, 0.09);

      --border:
        rgba(9, 21, 64, 0.14);
    }


    body.light header {
      background:
        rgba(255, 255, 255, 0.88);
    }



    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .song-grid {
        grid-template-columns: 1fr;
      }


      .column {
        border-right: none;

        border-bottom:
          1px solid var(--border);
      }


      .column:last-child {
        border-bottom: none;
      }


      .search-row {
        grid-template-columns:
          1fr 1fr;
      }


      .search-box {
        grid-column:
          1 / -1;
      }

    }


    @media (max-width: 560px) {

      .hero {
        padding-top: 55px;
      }


      .hero h1 {
        letter-spacing: -2px;
      }


      .header-inner {
        padding:
          0 16px;
      }


      .hero,
      .controls,
      .songbook {
        padding-left: 16px;

        padding-right: 16px;
      }


      .search-row {
        grid-template-columns:
          1fr;
      }


      .search-box {
        grid-column: auto;
      }


      .control-button {
        width: 100%;
      }

    }

  </style>

</head>

    <!-- =========================

      <div

      </div>


    </section>


  </main>



  <!-- =========================

  ========================== -->

  <div

      </div>

        class="modal-title"

      </div>



      <button

      </button>


    </div>


  </div>



  <!-- =========================
       TOAST
  ========================== -->

  <div

    ✓ 복사되었습니다

  <script>

      {

  let selectedCategory = "전체";


  let currentSong = null;


  const songGrid =
    document.getElementById("songGrid");


  const searchInput =
    document.getElementById("searchInput");


  const resultCount =
    document.getElementById("resultCount");


  const emptyState =
    document.getElementById("emptyState");


  const modal =
    document.getElementById("songModal");


  const toast =
    document.getElementById("toast");


  const sortSelect =
    document.getElementById("sortSelect");



  function renderSongs() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    let filtered =
      songs.filter(song => {

        const matchesCategory =
          selectedCategory === "전체" ||
          song.category === selectedCategory;


        const searchable =
          (
            song.title +
            " " +
            song.artist +
            " " +
            song.category
          ).toLowerCase();


        const matchesSearch =
          searchable.includes(search);


        return (
          matchesCategory &&
          matchesSearch
        );

      });



    /* SORT */

    if (sortSelect.value === "title") {

      filtered.sort(
        (ㄱ, ㄴ) =>
          a.title.localeCompare(
            b.title,
            "ko"
          )
      );

    }


    if (sortSelect.value === "artist") {

      filtered.sort(
        (ㄱ, ㄴ) =>
          a.artist.localeCompare(
            b.artist,
            "ko"
          )
      );

    }



    resultCount.textContent =
      `총 ${filtered.length}곡`;


    songGrid.innerHTML = "";


    if (filtered.length === 0) {

      songGrid.style.display = "none";

      emptyState.style.display = "block";

      return;

    }


    songGrid.style.display = "grid";

    emptyState.style.display = "none";



    const columns = [
      [],
      [],
      []
    ];


    filtered.forEach(
      (song, index) => {

        columns[
          index % 3
        ].push(song);

      }
    );



    columns.forEach(
      columnSongs => {

        const column =
          document.createElement("div");


        column.className =
          "column";


        const heading =
          document.createElement("div");


        heading.className =
          "column-title";


        column.appendChild(
          heading
        );



        columnSongs.forEach(
          song => {

            const button =
              document.createElement("button");


            button.className =
              "song";


            const info =
              document.createElement("div");


            info.className =
              "song-info";


            const title =
              document.createElement("div");


            title.className =
              "song-title";


            title.textContent =
              song.title;


            const artist =
              document.createElement("div");


            artist.className =
              "song-artist";


            artist.textContent =
              song.artist;


            info.appendChild(title);

            info.appendChild(artist);



            const meta =
              document.createElement("div");


            meta.className =
              "song-meta";


            meta.textContent =
              "클릭";


            button.appendChild(info);

            button.appendChild(meta);



            button.addEventListener(
              "click",
              () => openSong(song)
            );


            column.appendChild(button);

          }
        );


        songGrid.appendChild(column);

      }
    );

  }



  function openSong(song) {

    currentSong = song;


    document.getElementById(
      "modalCategory"
    ).textContent =
      song.category;


    document.getElementById(
      "modalTitle"
    ).textContent =
      song.title;


    document.getElementById(
      "modalArtist"
    ).textContent =
      song.artist;


    document.getElementById(
      "modalDifficulty"
    ).textContent =

      "★".repeat(song.difficulty) +

      "☆".repeat(
        5 - song.difficulty
      );


    document.getElementById(
      "modalGenre"
    ).textContent =
      song.category;


    modal.classList.add("show");

  }



  document
    .getElementById("copyButton")
    .addEventListener(
      "click",
      async () => {

        if (!currentSong) return;


        const text =
          `${currentSong.title} · ${currentSong.artist}`;


        try {

          await navigator.clipboard.writeText(
            text
          );


          showToast(
            "✓ 복사되었습니다"
          );

        } catch {

          showToast(
            "복사에 실패했습니다"
          );

        }

      }
    );



  document
    .getElementById("closeModal")
    .addEventListener(
      "click",
      () => {

        modal.classList.remove("show");

      }
    );



  modal.addEventListener(
    "click",
    event => {

      if (event.target === modal) {

        modal.classList.remove("show");

      }

    }
  );



  document.addEventListener(
    "keydown",
    event => {

      if (event.key === "Escape") {

        modal.classList.remove("show");

      }

    }
  );



  function showToast(message) {

    toast.textContent =
      message;


    toast.classList.add("show");


    setTimeout(
      () => {

        toast.classList.remove("show");

      },
      1600
    );

  }



  searchInput.addEventListener(
    "input",
    renderSongs
  );



  document
    .querySelectorAll(".filter")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter")
              .forEach(
                b =>
                  b.classList.remove("active")
              );


            button.classList.add("active");


            selectedCategory =
              button.dataset.category;


            renderSongs();

          }
        );

      }
    );



  document
    .getElementById("randomButton")
    .addEventListener(
      "click",
      () => {

        if (songs.length === 0) return;


        const randomSong =
          songs[
            Math.floor(
              Math.random() *
              songs.length
            )
          ];


        openSong(randomSong);

      }
    );



  sortSelect.addEventListener(
    "change",
    renderSongs
  );



  document
    .getElementById("themeButton")
    .addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "light"
        );


        const light =
          document.body.classList.contains(
            "light"
          );


        document.getElementById(
          "themeButton"
        ).textContent =
          light ? "☀" : "☾";

      }
    );



  renderSongs();

</script>
